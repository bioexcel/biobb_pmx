name: test_environment
channels:
  - conda-forge
  - bioconda
  - anaconda
dependencies:
  - biobb_common ==5.3.1
  - pillow
  - imagehash
  # To avoid fail related to old CPU architecture of the self-host runner,
  # and pmx-biobb 5.2.2 pmxanalyse (BAR) fails with numpy >=2.4 (also pinned in setup.py)
  - numpy <2.4.0
